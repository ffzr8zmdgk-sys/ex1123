<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 - Bean &amp; Mood</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; color: #333; background-color: #fcfbfa; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* 상단 고정 내비게이션 바 (GNB) */
        header { background-color: #fff; border-bottom: 1px solid #e5e0dc; position: sticky; top: 0; z-index: 1000; }
        .navbar { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; }
        .logo a { font-size: 24px; font-weight: bold; color: #6f4e37; }
        .nav-links { display: flex; gap: 28px; }
        .nav-links a { font-size: 16px; font-weight: 500; color: #555; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #6f4e37; font-weight: bold; }
        .auth-links { display: flex; gap: 12px; align-items: center; }
        .auth-links a { font-size: 14px; padding: 8px 14px; border-radius: 4px; border: 1px solid #dcd6d0; }
        .auth-links a.login { background-color: #fff; color: #6f4e37; }
        .auth-links a.signup { background-color: #6f4e37; color: #fff; border-color: #6f4e37; }
        .auth-links a.cart-link { background-color: #6f4e37; color: #fff; border-color: #6f4e37; font-weight: bold; }

        /* 장바구니 레이아웃 */
        .container { max-width: 1100px; margin: 45px auto; padding: 0 20px; }
        .page-title { font-size: 26px; color: #332211; margin-bottom: 24px; border-left: 4px solid #6f4e37; padding-left: 12px; }

        .cart-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start; }
        .cart-list { background: #fff; border: 1px solid #e5e0dc; border-radius: 8px; padding: 20px; }

        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid #f0ebe6; gap: 15px; }
        .cart-item:last-child { border-bottom: none; }

        .item-info-wrap { display: flex; align-items: center; gap: 16px; }
        .item-thumb { width: 80px; height: 80px; background-color: #f2ede8; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #7a685b; flex-shrink: 0; text-align: center; padding: 6px; }
        .item-name { font-size: 16px; font-weight: bold; color: #332211; margin-bottom: 4px; }
        .item-option { font-size: 13px; color: #777; }

        .item-controls { display: flex; align-items: center; gap: 14px; }
        .qty-box { display: flex; align-items: center; border: 1px solid #dcd6d0; border-radius: 4px; overflow: hidden; }
        .qty-btn { width: 28px; height: 28px; border: none; background: #faf8f6; cursor: pointer; font-weight: bold; color: #332211; }
        .qty-val { width: 34px; text-align: center; font-size: 14px; }

        .item-price { font-weight: bold; color: #6f4e37; min-width: 90px; text-align: right; }
        .del-btn { background: none; border: 1px solid #e0d8d0; color: #888; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .del-btn:hover { color: #c0392b; border-color: #c0392b; }

        .empty-cart { text-align: center; padding: 50px 20px; color: #777; }
        .empty-cart a { display: inline-block; margin-top: 14px; padding: 10px 20px; background: #6f4e37; color: #fff; border-radius: 4px; font-size: 14px; font-weight: bold; }

        /* 결제 요약 카드 */
        .summary-card { background: #fff; border: 1px solid #e5e0dc; border-radius: 8px; padding: 24px; }
        .summary-title { font-size: 18px; font-weight: bold; color: #332211; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .summary-row { display: flex; justify-content: space-between; font-size: 14px; color: #555; margin-bottom: 12px; }
        .summary-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #332211; margin-top: 16px; padding-top: 14px; border-top: 1px solid #e5e0dc; }
        .summary-total span:last-child { color: #6f4e37; }

        .checkout-btn { width: 100%; margin-top: 20px; padding: 14px; background-color: #6f4e37; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .checkout-btn:hover { background-color: #5a3e2b; }

        footer { background-color: #332211; color: #aaa; text-align: center; padding: 30px 0; margin-top: 70px; font-size: 14px; }

        @media (max-width: 820px) {
            .cart-layout { grid-template-columns: 1fr; }
            .cart-item { flex-direction: column; align-items: flex-start; }
            .item-controls { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">Bean &amp; Mood</a></div>
            <ul class="nav-links">
                <li><a href="shop.html">Shop</a></li>
                <li><a href="community.html">Community</a></li>
                <li><a href="guestbook.html">Guestbook(방명록)</a></li>
                <li><a href="notice.html">Customer Center</a></li>
            </ul>
            <div class="auth-links">
                <a href="login.html" class="login">로그인</a>
                <a href="signup.html" class="signup">회원가입</a>
                <a href="cart.html" class="cart-link active" id="navCartLink">장바구니</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <h2 class="page-title">장바구니</h2>

        <div class="cart-layout">
            <div class="cart-list" id="cartList"></div>

            <aside class="summary-card">
                <h3 class="summary-title">결제 예정 금액</h3>
                <div class="summary-row">
                    <span>총 상품 금액</span>
                    <span id="subtotalPrice">0원</span>
                </div>
                <div class="summary-row">
                    <span>배송비 (30,000원 이상 무료)</span>
                    <span id="shippingFee">0원</span>
                </div>
                <div class="summary-total">
                    <span>총 결제 금액</span>
                    <span id="totalPrice">0원</span>
                </div>
                <button type="button" class="checkout-btn" id="checkoutBtn">주문하기</button>
            </aside>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Bean &amp; Mood. All rights reserved.</p>
    </footer>

    <script>
        let cartItems = JSON.parse(localStorage.getItem('beanMoodCart') || 'null');
        if (!cartItems) {
            cartItems = [
                { id: 1, name: '에티오피아 예가체프 싱글오리진', option: '핸드드립용 분쇄 / 200g', price: 18000, qty: 1, tag: 'Bean' },
                { id: 2, name: '세라믹 하리오 드리퍼 세트', option: '화이트 / 1~2인용', price: 24000, qty: 1, tag: 'Tool' }
            ];
            saveCart();
        }

        function saveCart() {
            localStorage.setItem('beanMoodCart', JSON.stringify(cartItems));
        }

        function formatWon(num) {
            return num.toLocaleString('ko-KR') + '원';
        }

        function updateNavBadge() {
            const totalQty = cartItems.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('navCartLink').textContent = totalQty > 0 ? `장바구니 (${totalQty})` : '장바구니';
        }

        function updateQty(id, delta) {
            const target = cartItems.find(item => item.id === id);
            if (!target) return;
            target.qty += delta;
            if (target.qty <= 0) {
                removeItem(id);
                return;
            }
            saveCart();
            renderCart();
        }

        function removeItem(id) {
            cartItems = cartItems.filter(item => item.id !== id);
            saveCart();
            renderCart();
        }

        function renderCart() {
            const listEl = document.getElementById('cartList');
            const subtotalEl = document.getElementById('subtotalPrice');
            const shippingEl = document.getElementById('shippingFee');
            const totalEl = document.getElementById('totalPrice');

            updateNavBadge();

            if (cartItems.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-cart">
                        <p>장바구니에 담긴 상품이 없습니다.</p>
                        <a href="index.html">쇼핑 계속하기</a>
                    </div>
                `;
                subtotalEl.textContent = '0원';
                shippingEl.textContent = '0원';
                totalEl.textContent = '0원';
                return;
            }

            listEl.innerHTML = cartItems.map(item => `
                <div class="cart-item">
                    <div class="item-info-wrap">
                        <div class="item-thumb">${item.tag}</div>
                        <div>
                            <div class="item-name">${item.name}</div>
                            <div class="item-option">옵션: ${item.option}</div>
                        </div>
                    </div>
                    <div class="item-controls">
                        <div class="qty-box">
                            <button type="button" class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                            <span class="qty-val">${item.qty}</span>
                            <button type="button" class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                        <div class="item-price">${formatWon(item.price * item.qty)}</div>
                        <button type="button" class="del-btn" onclick="removeItem(${item.id})">삭제</button>
                    </div>
                </div>
            `).join('');

            const subtotal = cartItems.reduce((sum, item) => sum + item.price * item.qty, 0);
            const shipping = subtotal >= 30000 ? 0 : 3000;
            const total = subtotal + shipping;

            subtotalEl.textContent = formatWon(subtotal);
            shippingEl.textContent = shipping === 0 ? '무료배송' : formatWon(shipping);
            totalEl.textContent = formatWon(total);
        }

        document.getElementById('checkoutBtn').addEventListener('click', function() {
            if (cartItems.length === 0) {
                alert('장바구니에 담긴 상품이 없습니다.');
                return;
            }
            const subtotal = cartItems.reduce((sum, item) => sum + item.price * item.qty, 0);
            const shipping = subtotal >= 30000 ? 0 : 3000;
            alert('총 ' + formatWon(subtotal + shipping) + ' 주문이 접수되었습니다. 감사합니다!');
        });

        renderCart();
    </script>
</body>
</html>
